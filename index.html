<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QC Team Workboard</title>
  <meta name="description" content="QC 팀의 개인별 시험업무를 주간 단위로 관리하는 Non-GMP 업무 보조 도구" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314233b'/%3E%3Cpath d='M18 16h28v9H18zm0 13h18v9H18zm0 13h24v9H18z' fill='%233b82f6'/%3E%3C/svg%3E" />
  <style>
    :root{--navy:#101b2d;--ink:#172033;--muted:#64748b;--line:#dce3ed;--surface:#fff;--bg:#f3f6fa;--blue:#2563eb;--blue-soft:#eaf2ff;--green:#15803d;--green-soft:#e9f8ef;--amber:#b45309;--amber-soft:#fff4df;--purple:#7e22ce;--purple-soft:#f5eaff;--red:#c2413b;--red-soft:#fff0ef;--gray:#64748b;--gray-soft:#eef2f6}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:16px} button,input,select,textarea{font:inherit}
    .topbar{height:58px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.brand-mark{width:30px;height:30px;border-radius:8px;background:#2f6fed;display:grid;place-items:center;font-size:13px}.top-note{font-size:13px;color:#cbd5e1}.top-right{display:flex;align-items:center;gap:10px}.non-gmp{font-size:12px;padding:5px 9px;border:1px solid #526078;border-radius:999px;color:#dbeafe}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:800;font-size:13px}
    main{max-width:1780px;margin:0 auto;padding:24px 28px 36px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.heading h1{font-size:24px;margin:0 0 6px}.heading p{margin:0;color:var(--muted);font-size:14px}.primary{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer}.primary:hover{background:#1d4ed8}.secondary{border:1px solid #cfd8e5;background:white;color:#263247;border-radius:8px;padding:9px 12px;cursor:pointer}.secondary:hover{background:#f8fafc}
    .summary{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:10px;margin-bottom:14px}.summary-card{background:white;border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-height:82px}.summary-card span{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.summary-card strong{font-size:25px;line-height:1}.summary-card em{font-size:12px;font-style:normal;margin-left:5px;color:#94a3b8}
    .toolbar{background:white;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tool-left,.tool-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.week-label{font-weight:800;min-width:190px;text-align:center}.segmented{display:flex;background:#edf2f8;border-radius:8px;padding:3px}.segmented button{border:0;background:transparent;padding:7px 12px;border-radius:6px;font-size:14px;cursor:pointer}.segmented button.active{background:white;color:var(--blue);font-weight:750;box-shadow:0 1px 4px #cbd5e1}.search{width:230px;border:1px solid #cfd8e5;border-radius:8px;padding:9px 11px}.filter,.date-picker{border:1px solid #cfd8e5;border-radius:8px;padding:9px 10px;background:white}.date-picker{width:145px}.is-hidden{display:none!important}
    .board-wrap{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:white;overflow:auto;max-height:calc(100vh - 315px);min-height:440px}.board{display:grid;grid-template-columns:190px repeat(5,minmax(220px,1fr));min-width:1290px}.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;min-height:142px;background:#fff}.cell:nth-child(6n){border-right:0}.head{position:sticky;top:0;z-index:10;min-height:auto;background:#f8fafc;text-align:center;font-weight:800;padding:11px}.head small{display:block;margin-top:3px;color:var(--muted);font-weight:500}.person{position:sticky;left:0;z-index:8;background:#f8fafc;padding:14px}.person strong{display:block;margin-bottom:5px}.person span{font-size:13px;color:var(--muted)}.load{height:7px;background:#e5eaf1;border-radius:99px;margin-top:13px;overflow:hidden}.load i{display:block;height:100%;background:#3b82f6;border-radius:99px}.task{border:1px solid #d5deea;border-left:4px solid var(--blue);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:var(--blue-soft);cursor:pointer;transition:.15s}.task:hover{transform:translateY(-1px);box-shadow:0 4px 12px #cbd5e180}.task strong{font-size:14px;display:block;margin-bottom:5px;line-height:1.35}.task-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:#536175}.chip{padding:2px 6px;border-radius:999px;background:#fff;border:1px solid #d8e0eb}.task.working{border-left-color:var(--amber);background:var(--amber-soft)}.task.review{border-left-color:var(--purple);background:var(--purple-soft)}.task.done{border-left-color:var(--green);background:var(--green-soft);opacity:.82}.task.delay{border-left-color:var(--red);background:var(--red-soft)}.empty-add{border:1px dashed #cfd8e5;border-radius:8px;color:#94a3b8;background:#fbfdff;width:100%;padding:7px;cursor:pointer}.empty-add:hover{color:var(--blue);border-color:#93b4f4}
    .cell{transition:background .15s,box-shadow .15s}.cell.drop-target{background:#eef5ff!important;box-shadow:inset 0 0 0 2px #60a5fa}.task{cursor:grab}.task:active{cursor:grabbing}.task.dragging{opacity:.35;transform:scale(.98)}
    main{padding:16px 22px 28px}.heading{margin-bottom:12px}.heading h1{font-size:22px;margin-bottom:3px}.summary{gap:8px;margin-bottom:10px}.summary-card{min-height:58px;padding:9px 13px;display:flex;align-items:center;gap:5px}.summary-card span{margin:0 auto 0 0;font-size:13px;font-weight:650}.summary-card strong{font-size:21px}.summary-card em{margin-left:0}.toolbar{padding:8px 10px}.board-wrap{max-height:calc(100vh - 248px);min-height:560px}.board{min-width:1180px}.cell{min-height:112px;padding:7px 8px}.head{min-height:58px;padding:8px;background:#edf2f7;display:flex;flex-direction:column;justify-content:center}.head b{font-size:15px}.head small{font-size:12px}.board>.head:first-child{left:0;z-index:12}.person{padding:11px 12px;border-right:2px solid #d3dce8}.person strong{font-size:15px}.person span{font-size:12px}.load{height:5px;margin-top:9px}.row-alt{background:#f8fafc}.today-col{background:#f2f7ff}.head.today-col{background:#dbeafe;color:#174aa7;box-shadow:inset 0 -3px 0 #3b82f6}.today-badge{display:inline-block;font-size:11px;color:white;background:#2563eb;border-radius:999px;padding:1px 6px;margin-left:5px;vertical-align:1px}.task{padding:7px 8px;margin-bottom:6px;box-shadow:0 1px 2px #0f172a0d}.task strong{font-size:14px;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.task-meta{font-size:12px;line-height:1.25}.chip{font-weight:750;padding:2px 6px}.task.plan .chip{color:#1d4ed8}.task.working .chip{color:#9a4b05}.task.review .chip{color:#7e22ce}.task.delay .chip{color:#b42318}.task.done .chip{color:#15803d}.empty-add{padding:5px;opacity:.42}.empty-add:hover{opacity:1}.legend{margin-top:8px}
    .legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.dot.plan{background:var(--blue)}.dot.working{background:#d97706}.dot.review{background:#9333ea}.dot.done{background:#16a34a}.dot.delay{background:#dc2626}
    dialog{border:0;border-radius:14px;padding:0;width:min(620px,calc(100vw - 24px));box-shadow:0 20px 60px #0f172a55}dialog::backdrop{background:#0f172a99}.modal-head{padding:20px 22px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:transparent;font-size:25px;cursor:pointer;color:#64748b}.form{padding:19px 22px 22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:8px;padding:10px 11px;background:white}.field textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.actions-right{display:flex;gap:8px}.danger{border:1px solid #fecaca;background:#fff;color:#b91c1c;border-radius:8px;padding:9px 12px;cursor:pointer}.hidden{visibility:hidden}
    .toast{position:fixed;right:22px;bottom:22px;background:#172033;color:white;padding:12px 16px;border-radius:9px;box-shadow:0 8px 25px #0003;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:900px){.top-note,.non-gmp{display:none}main{padding:18px 14px}.heading{align-items:center}.heading h1{font-size:21px}.summary{grid-template-columns:repeat(2,1fr)}.summary-card:last-child{grid-column:1/-1}.board-wrap{max-height:none}.toolbar{align-items:stretch}.tool-left,.tool-right{width:100%}.search{flex:1;min-width:180px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{padding:0 14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">QC</span><span>QC Team Workboard</span><span class="top-note">제품분석1팀 · Schedule</span></div>
    <div class="top-right"><span class="non-gmp">Non-GMP 업무 보조</span><span class="avatar">TL</span></div>
  </header>
  <main>
    <section class="heading">
      <div><h1>팀 주간 시험업무</h1><p>업무 카드를 다른 칸으로 드래그하면 날짜와 담당자를 바로 변경할 수 있습니다.</p></div>
      <button class="primary" id="newTask">+ 업무 등록</button>
    </section>
    <section class="summary" aria-label="업무 요약">
      <div class="summary-card"><span id="totalLabel">이번 주 전체</span><strong id="totalCount">0</strong><em>건</em></div>
      <div class="summary-card"><span>진행 중</span><strong id="workingCount">0</strong><em>건</em></div>
      <div class="summary-card"><span>검토 대기</span><strong id="reviewCount">0</strong><em>건</em></div>
      <div class="summary-card"><span>지연·이슈</span><strong id="delayCount">0</strong><em>건</em></div>
      <div class="summary-card"><span>완료</span><strong id="doneCount">0</strong><em>건</em></div>
    </section>
    <section class="toolbar">
      <div class="tool-left">
        <button class="secondary" id="prevWeek">◀ 이전주</button><button class="secondary" id="today">오늘</button>
        <span class="week-label" id="weekLabel"></span><button class="secondary" id="nextWeek">다음주 ▶</button>
        <input class="date-picker" type="date" id="focusDate" aria-label="조회 날짜" />
        <button class="primary" id="dayView">선택일 보기</button><button class="secondary is-hidden" id="weekView">주간 보기</button>
      </div>
      <div class="tool-right">
        <div class="segmented" aria-label="보기 방식"><button class="active" data-view="team">팀 전체</button><button data-view="mine">내 업무</button></div>
        <input class="search" id="search" placeholder="품목·시험항목 검색" aria-label="업무 검색" />
        <select class="filter" id="statusFilter" aria-label="상태 필터"><option value="all">상태 전체</option><option value="plan">예정</option><option value="working">진행 중</option><option value="review">검토 대기</option><option value="delay">지연·이슈</option><option value="done">완료</option></select>
      </div>
    </section>
    <section class="board-wrap"><div class="board" id="board"></div></section>
    <div class="legend"><span><i class="dot plan"></i>예정</span><span><i class="dot working"></i>진행 중</span><span><i class="dot review"></i>검토 대기</span><span><i class="dot delay"></i>지연·이슈</span><span><i class="dot done"></i>완료</span><span>※ 공식 시험기록은 LIMS 및 관련 기록서에서 관리</span></div>
  </main>
  <dialog id="taskDialog">
    <div class="modal-head"><h2 id="modalTitle">업무 등록</h2><button class="close" id="closeDialog" aria-label="닫기">×</button></div>
    <form class="form" id="taskForm">
      <input type="hidden" id="taskId" />
      <div class="form-grid">
        <div class="field"><label for="employee">담당자</label><select id="employee" required></select></div>
        <div class="field"><label for="date">예정일</label><input type="date" id="date" required /></div>
        <div class="field full"><label for="title">품목 / 업무명</label><input id="title" required placeholder="예: RG0126H010 유연물질" /></div>
        <div class="field"><label for="testItem">시험항목</label><input id="testItem" placeholder="예: Related substances" /></div>
        <div class="field"><label for="status">진행상태</label><select id="status"><option value="plan">예정</option><option value="working">진행 중</option><option value="review">검토 대기</option><option value="delay">지연·이슈</option><option value="done">완료</option></select></div>
        <div class="field"><label for="priority">우선순위</label><select id="priority"><option value="보통">보통</option><option value="긴급">긴급</option><option value="낮음">낮음</option></select></div>
        <div class="field full"><label for="memo">비고</label><textarea id="memo" placeholder="인계사항 또는 간단한 메모"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="danger hidden" id="deleteTask">삭제</button><div class="actions-right"><button type="button" class="secondary" id="cancelDialog">취소</button><button type="submit" class="primary">저장</button></div></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const employees=[
      {id:'kim',name:'김지우',role:'제품분석',mine:true},
      {id:'park',name:'박민수',role:'제품분석'},
      {id:'choi',name:'최서연',role:'제품분석'},
      {id:'lee',name:'이준호',role:'제품분석'},
      {id:'jung',name:'정하늘',role:'제품분석'}
    ];
    const mondayOf=d=>{const x=new Date(d);const day=x.getDay()||7;x.setHours(12,0,0,0);x.setDate(x.getDate()-day+1);return x};
    const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
    const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
    const baseMonday=mondayOf(new Date());
    const demo=[
      ['kim',0,'RG0126H010 검체 전처리','유연물질','working','F26-0837'],['kim',1,'RG0126H010 HPLC 분석','유연물질','plan','F26-0837'],['kim',2,'RG0126H010 적분','유연물질','plan','F26-0837'],['kim',3,'결과 검토 요청','유연물질','review','F26-0837'],
      ['park',0,'LTWRS2601 표준액 조제','함량','done','LTWRS2601'],['park',1,'AD26-0650 ND 분석','함량','working','AD26-0650'],['park',3,'분석결과 정리','함량','plan','AD26-0650'],
      ['choi',0,'BN-3201 장비점검 확인','시험 준비','plan',''],['choi',2,'HLC-3228 시스템적합성','관련물질','delay','BN-3201'],['choi',4,'재분석 여부 확인','관련물질','review','BN-3201'],
      ['lee',1,'ND01 표준액 조제','정량','working','ND01'],['lee',2,'ND01 시료 분석','정량','plan','ND01'],['lee',3,'ND01 적분','정량','plan','ND01'],
      ['jung',0,'안정성 검체 확인','함량','done','STB26-0068'],['jung',2,'안정성 HPLC 분석','함량','working','STB26-0068'],['jung',4,'시험기록 정리','함량','plan','STB26-0068']
    ].map((t,i)=>({id:'demo-'+i,employee:t[0],date:iso(addDays(baseMonday,t[1])),title:t[2],testItem:t[3],status:t[4],priority:'보통',memo:''}));
    let tasks=(JSON.parse(localStorage.getItem('qc-workboard-tasks')||'null')||demo).map(({batch,...task})=>task);
    let weekStart=new Date(baseMonday);let selectedDate=iso(new Date());let period='week';let view='team';
    const statusName={plan:'예정',working:'진행 중',review:'검토 대기',delay:'지연·이슈',done:'완료'};
    const $=s=>document.querySelector(s);const board=$('#board'),dialog=$('#taskDialog'),form=$('#taskForm');
    const save=()=>localStorage.setItem('qc-workboard-tasks',JSON.stringify(tasks));
    function fmtDate(d){return `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`}
    function dayTitle(d){return ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()]}
    function render(){
      const days=period==='day'?[new Date(`${selectedDate}T12:00:00`)]:[0,1,2,3,4].map(i=>addDays(weekStart,i));const start=iso(days[0]),end=iso(days[days.length-1]);
      $('#weekLabel').textContent=period==='day'?`${fmtDate(days[0])} 업무`:`${start} ~ ${end}`;
      $('#totalLabel').textContent=period==='day'?'선택일 전체':'이번 주 전체';
      $('#prevWeek').textContent=period==='day'?'◀ 전날':'◀ 이전주';$('#nextWeek').textContent=period==='day'?'다음날 ▶':'다음주 ▶';
      $('#focusDate').value=selectedDate;$('#dayView').classList.toggle('is-hidden',period==='day');$('#weekView').classList.toggle('is-hidden',period!=='day');
      board.style.gridTemplateColumns=period==='day'?'175px minmax(380px,1fr)':'175px repeat(5,minmax(190px,1fr))';board.style.minWidth=period==='day'?'580px':'1125px';
      const q=$('#search').value.trim().toLowerCase(),sf=$('#statusFilter').value;
      const visibleEmployees=view==='mine'?employees.filter(e=>e.mine):employees;
      const filtered=tasks.filter(t=>t.date>=start&&t.date<=end&&(sf==='all'||t.status===sf)&&(!q||`${t.title} ${t.testItem}`.toLowerCase().includes(q)));
      const todayIso=iso(new Date());
      board.innerHTML='<div class="cell head"><b>담당자</b><small>주간 업무량</small></div>'+days.map(d=>`<div class="cell head ${iso(d)===todayIso?'today-col':''}"><b>${dayTitle(d)}${iso(d)===todayIso?'<span class="today-badge">오늘</span>':''}</b><small>${d.getMonth()+1}월 ${d.getDate()}일</small></div>`).join('');
      visibleEmployees.forEach((emp,rowIndex)=>{
        const rowClass=rowIndex%2?'row-alt':'';
        const weekly=filtered.filter(t=>t.employee===emp.id);const load=Math.min(100,weekly.length*18);
        board.insertAdjacentHTML('beforeend',`<div class="cell person ${rowClass}"><strong>${emp.name}</strong><span>${emp.role} · ${weekly.length}건</span><div class="load"><i style="width:${load}%"></i></div></div>`);
        days.forEach(d=>{
          const date=iso(d),order={delay:0,working:1,review:2,plan:3,done:4},dayTasks=weekly.filter(t=>t.date===date).sort((a,b)=>order[a.status]-order[b.status]||a.title.localeCompare(b.title,'ko'));
          board.insertAdjacentHTML('beforeend',`<div class="cell ${rowClass} ${date===todayIso?'today-col':''}" data-employee="${emp.id}" data-date="${date}">${dayTasks.map(taskHtml).join('')}<button class="empty-add" data-add="1">+ 업무</button></div>`);
        });
      });
      updateSummary(filtered);
      board.querySelectorAll('.task').forEach(el=>{
        el.onclick=()=>{if(!suppressClick)openTask(el.dataset.id)};
        el.ondragstart=e=>{draggedTaskId=el.dataset.id;suppressClick=true;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedTaskId);requestAnimationFrame(()=>el.classList.add('dragging'))};
        el.ondragend=()=>{draggedTaskId=null;el.classList.remove('dragging');board.querySelectorAll('.drop-target').forEach(c=>c.classList.remove('drop-target'));setTimeout(()=>suppressClick=false,80)};
      });
      board.querySelectorAll('.cell[data-date]').forEach(cell=>{
        cell.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';cell.classList.add('drop-target')};
        cell.ondragleave=e=>{if(!cell.contains(e.relatedTarget))cell.classList.remove('drop-target')};
        cell.ondrop=e=>{e.preventDefault();const id=draggedTaskId||e.dataTransfer.getData('text/plain'),task=tasks.find(t=>t.id===id);if(!task)return;task.date=cell.dataset.date;task.employee=cell.dataset.employee;save();render();const name=employees.find(x=>x.id===task.employee)?.name||'';toast(`${name} · ${task.date}로 이동했습니다.`);setTimeout(()=>suppressClick=false,80)};
      });
      board.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{const c=el.closest('.cell');openNew(c.dataset.employee,c.dataset.date)});
    }
    function taskHtml(t){return `<article class="task ${t.status}" data-id="${t.id}" tabindex="0" draggable="true"><strong>${escapeHtml(t.title)}</strong><div class="task-meta"><span class="chip">${statusName[t.status]}</span>${t.testItem?`<span>${escapeHtml(t.testItem)}</span>`:''}${t.priority==='긴급'?'<span class="chip">긴급</span>':''}</div></article>`}
    function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function updateSummary(list){$('#totalCount').textContent=list.length;['working','review','delay','done'].forEach(s=>$(`#${s}Count`).textContent=list.filter(t=>t.status===s).length)}
    function openNew(employee=employees[0].id,date=iso(weekStart)){
      form.reset();$('#taskId').value='';$('#employee').value=employee;$('#date').value=date;$('#modalTitle').textContent='시험업무 등록';$('#deleteTask').classList.add('hidden');dialog.showModal();
    }
    function openTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;$('#taskId').value=t.id;['employee','date','title','testItem','status','priority','memo'].forEach(k=>$(`#${k}`).value=t[k]||'');$('#modalTitle').textContent='시험업무 수정';$('#deleteTask').classList.remove('hidden');dialog.showModal()}
    function close(){dialog.close()}
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    employees.forEach(e=>$('#employee').insertAdjacentHTML('beforeend',`<option value="${e.id}">${e.name}</option>`));
    $('#newTask').onclick=()=>openNew(undefined,period==='day'?selectedDate:undefined);$('#closeDialog').onclick=close;$('#cancelDialog').onclick=close;
    form.onsubmit=e=>{e.preventDefault();const id=$('#taskId').value;const item={id:id||crypto.randomUUID(),employee:$('#employee').value,date:$('#date').value,title:$('#title').value.trim(),testItem:$('#testItem').value.trim(),status:$('#status').value,priority:$('#priority').value,memo:$('#memo').value.trim()};if(id)tasks=tasks.map(t=>t.id===id?item:t);else tasks.push(item);save();close();render();toast(id?'업무가 수정되었습니다.':'업무가 등록되었습니다.')};
    $('#deleteTask').onclick=()=>{const id=$('#taskId').value;if(!id)return;tasks=tasks.filter(t=>t.id!==id);save();close();render();toast('업무가 삭제되었습니다.')};
    $('#prevWeek').onclick=()=>{if(period==='day')selectedDate=iso(addDays(new Date(`${selectedDate}T12:00:00`),-1));else weekStart=addDays(weekStart,-7);render()};
    $('#nextWeek').onclick=()=>{if(period==='day')selectedDate=iso(addDays(new Date(`${selectedDate}T12:00:00`),1));else weekStart=addDays(weekStart,7);render()};
    $('#today').onclick=()=>{weekStart=new Date(baseMonday);selectedDate=iso(new Date());render()};
    $('#focusDate').value=selectedDate;$('#focusDate').onchange=e=>{selectedDate=e.target.value||iso(new Date())};
    $('#dayView').onclick=()=>{selectedDate=$('#focusDate').value||selectedDate;period='day';render()};$('#weekView').onclick=()=>{weekStart=mondayOf(new Date(`${selectedDate}T12:00:00`));period='week';render()};
    $('#search').oninput=render;$('#statusFilter').onchange=render;
    document.querySelectorAll('.segmented button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.segmented button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});
    let draggedTaskId=null,suppressClick=false;
    board.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('task'))openTask(e.target.dataset.id)});
    function registerModelTools(){
      const context=document.modelContext;if(!context?.registerTool)return;
      const validStatus=new Set(Object.keys(statusName)),validEmployees=new Set(employees.map(e=>e.id));
      Promise.resolve(context.registerTool({
        name:'list_week_tasks',title:'주간 시험업무 조회',description:'현재 화면에 선택된 주의 시험업무 목록을 담당자 또는 상태로 조회합니다.',
        inputSchema:{type:'object',properties:{employee:{type:'string'},status:{type:'string'}},additionalProperties:false},
        annotations:{readOnlyHint:true,untrustedContentHint:false},
        execute(input={}){if(input.employee&&!validEmployees.has(input.employee))throw new Error('존재하지 않는 담당자입니다.');if(input.status&&!validStatus.has(input.status))throw new Error('존재하지 않는 상태입니다.');const start=iso(weekStart),end=iso(addDays(weekStart,4));return {week:{start,end},tasks:tasks.filter(t=>t.date>=start&&t.date<=end&&(!input.employee||t.employee===input.employee)&&(!input.status||t.status===input.status)).map(t=>({...t,employeeName:employees.find(e=>e.id===t.employee)?.name}))}}
      })).catch(()=>{});
      Promise.resolve(context.registerTool({
        name:'create_test_task',title:'시험업무 등록',description:'담당자와 예정일을 지정해 새로운 시험업무를 등록하고 주간 업무표를 갱신합니다.',
        inputSchema:{type:'object',properties:{employee:{type:'string'},date:{type:'string'},title:{type:'string'},testItem:{type:'string'},status:{type:'string'}},required:['employee','date','title'],additionalProperties:false},
        annotations:{readOnlyHint:false,untrustedContentHint:false},
        execute(input){if(!validEmployees.has(input.employee))throw new Error('존재하지 않는 담당자입니다.');if(!/^\d{4}-\d{2}-\d{2}$/.test(input.date))throw new Error('날짜는 YYYY-MM-DD 형식이어야 합니다.');if(!input.title?.trim())throw new Error('업무명이 필요합니다.');const status=input.status||'plan';if(!validStatus.has(status))throw new Error('존재하지 않는 상태입니다.');const item={id:crypto.randomUUID(),employee:input.employee,date:input.date,title:input.title.trim(),testItem:(input.testItem||'').trim(),status,priority:'보통',memo:''};tasks.push(item);save();render();return {created:true,id:item.id,status:item.status}}
      })).catch(()=>{});
    }
    registerModelTools();
    render();
  </script>
</body>
</html>
